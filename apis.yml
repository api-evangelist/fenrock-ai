name: Fenrock AI
description: >-
  Fenrock AI is a Y Combinator (W26) company building specialized AI agents for
  the banking back office. Founded in 2026 and based in San Francisco by Charu
  Sharma and Michael M., Fenrock overlays on a bank's existing systems and
  ingests internal policies and standard operating procedures to automate
  compliance, financial-crime, and loan-operations workflows without requiring
  data migration. Its agents assist analysts with alert triage, case
  investigation, suspicious-activity-report (SAR) drafting, quality assurance,
  enhanced due diligence, KYC/KYB reviews, and sanctions/PEP monitoring, while
  preserving bullet-proof audit logs designed to pass regulatory examinations.
  Fenrock positions itself as an AI workspace that lets a single analyst process
  many times the volume of financial-crime and money-laundering cases. This
  profile is an API Evangelist network company record; Fenrock is an
  enterprise product company with no public API, developer portal, or
  documentation surface at this time.
